spring.application.name=veterinaria

# Conexión a MySQL

spring.datasource.url=jdbc:mysql://localhost:3307/veterinaria_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración Hibernate / JPA

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Clave secreta para JWT (Mínimo 32 caracteres)

jwt.secret=claveSecretaSuperSeguraVeterinaria123456789

logging.level.org.springframework.security=DEBUG